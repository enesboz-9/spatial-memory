workflows:
  ios-release:
    name: iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      vars:
        APP_VERSION: "1.0.1"        # App Store Connect'teki sürüm numarasıyla birebir aynı olmalı
        APP_STORE_APPLE_ID: "BURAYA_APPLE_ID"  # ASC > Uygulama > Genel Bilgiler > Apple ID (sayısal)
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        provisioning_profiles:
          - spatial_profile
        certificates:
          - dist_cert_2026
    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get
      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Set build number from App Store Connect
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          LATEST=${LATEST:-0}
          NEW=$((LATEST + 1))
          echo "Latest TestFlight build: $LATEST -> new build: $NEW"
          echo "NEW_BUILD_NUMBER=$NEW" >> $CM_ENV
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-name=$APP_VERSION \
            --build-number=$NEW_BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
